services:
  - type: web
    name: lovepdf-saas-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: LICENSE_SIGNING_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://lovepdf.free.nf
      - key: BILLING_URL
        value: https://lovepdf.free.nf/vendor/billing.php
      - key: TRIAL_DAYS
        value: "3"
      - key: TRIAL_CREDITS
        value: "50"
      - key: MAX_FILE_MB
        value: "50"
