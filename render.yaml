services:
  - type: web
    name: lovepdf-compressor-api
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: LovePDF Compressor API
      - key: MAX_FILE_MB
        value: "50"
      - key: ALLOWED_ORIGINS
        value: "*"
      # Optional. Add a secret value in the Render dashboard if you want authentication:
      # - key: API_KEY
      #   sync: false
